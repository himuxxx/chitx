<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fdf7f0">
<title>চিঠি — কিছু কথা রয়ে যায়</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  :root{--ink:#2b2118;--muted:#8a7b6c;--line:#ecdfd0;--paper:#fffdf8;--pink:#e0557a;--pink-2:#ff8fab}
  
  /* True App Layout Setup */
  html, body {
    height: 100%;
    overflow: hidden; /* পুরো পেজ স্ক্রল বন্ধ */
    margin: 0;
    padding: 0;
  }
  body{
    font-family:'Hind Siliguri',system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 600px at 8% -12%, #ffe3ec 0%, transparent 58%),
      radial-gradient(900px 600px at 102% 0%, #e4eeff 0%, transparent 55%),
      radial-gradient(900px 700px at 50% 120%, #fff2df 0%, transparent 60%),
      #fdf7f0;
    -webkit-font-smoothing:antialiased;
    touch-action: manipulation;
  }
  
  [hidden] { display: none !important; }

  /* মূল অ্যাপ কন্টেইনার (যা স্ক্রিনের ভেতরে ফিট থাকবে) */
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh; /* মোবাইলের ডায়নামিক ভিউপোর্ট */
    max-width: 860px;
    margin: 0 auto;
    padding: 10px;
  }

  /* হেডার (ফিক্সড) */
  header{text-align:center; margin-bottom: 10px; flex-shrink: 0;}
  .seal{
    width:48px;height:48px;margin:0 auto 6px;
    display:grid;place-items:center;font-size:24px;
    background:linear-gradient(145deg,#fff,#ffeef3);
    border:1px solid #f6d4de;border-radius:16px;
    animation: sealWiggle 3s ease-in-out infinite, sealGlow 2.4s ease-in-out infinite;
    will-change: transform;
  }
  @keyframes sealWiggle{
    0%,100%{transform:rotate(-6deg) translateY(0)}
    15%{transform:rotate(-10deg) translateY(-4px)}
    30%{transform:rotate(-2deg) translateY(-2px)}
    45%{transform:rotate(-9deg) translateY(-5px)}
    60%{transform:rotate(-4deg) translateY(-1px)}
    75%{transform:rotate(2deg) translateY(-4px)}
  }
  @keyframes sealGlow{
    0%,100%{box-shadow:0 10px 26px -12px rgba(224,85,122,.55)}
    50%{box-shadow:0 16px 34px -10px rgba(224,85,122,.85)}
  }
  h1{font-family:'Tiro Bangla',serif;font-size:clamp(24px,6vw,36px);margin:0;letter-spacing:.5px}
  .tag{margin:2px 0 0;color:var(--muted);font-size:13px;}

  /* ট্যাবস (ফিক্সড) */
  .tabs{
    display:flex;gap:4px;padding:4px;
    background:rgba(255,255,255,.9);
    border:1px solid var(--line);
    border-radius:14px;
    backdrop-filter:blur(12px);
    margin:0 auto 10px;
    width:100%; max-width: 480px;
    box-shadow:0 8px 20px -16px rgba(43,33,24,.5);
    flex-shrink: 0;
    z-index: 100;
  }
  .tabs button{flex:1;padding:8px;border:0;border-radius:10px;background:transparent;color:var(--muted);
    font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.18s}
  .tabs button.active{background:linear-gradient(145deg,#fff,#ffe9ef);color:var(--pink);
    box-shadow:0 4px 12px -8px rgba(224,85,122,.9), inset 0 0 0 1px #f8d6e0}

  /* মূল কন্টেন্ট এরিয়া (যা বাকি জায়গা নেবে) */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* প্রতিটি ট্যাব পেজ */
  section[id^="tab-"] {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    width: 100%;
  }

  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px;
    box-shadow:0 10px 30px -24px rgba(43,33,24,.55);
    display: flex;
    flex-direction: column;
    overflow: hidden; /* কার্ডের ভেতরে স্ক্রল হবে */
  }

  /* WRITE ট্যাব (ফর্ম ফিট হবে) */
  #tab-write .card { flex: 1; }
  #letterForm {
    flex: 1; display: flex; flex-direction: column; overflow: hidden;
  }
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px; flex-shrink: 0;}
  .field{margin-bottom:8px; flex-shrink: 0;}
  
  label{display:block;font-size:13px;font-weight:600;margin:0 0 4px;color:#5a4b3d}
  input[type=text], textarea{
    width:100%;padding:10px 12px;font-family:inherit;font-size:16px;color:var(--ink);
    background:#fffefb;border:1px solid #e9dccc;border-radius:10px;outline:none;transition:.16s;
  }
  input:focus, textarea:focus{border-color:var(--pink-2);box-shadow:0 0 0 3px rgba(255,143,171,.18);background:#fff}
  
  /* টেক্সট এরিয়া ফ্লেক্সিবল হবে */
  .textarea-box { flex: 1; display: flex; flex-direction: column; overflow: hidden; margin-bottom: 8px;}
  textarea{flex: 1; resize: none; line-height:1.7;font-family:'Tiro Bangla',serif; font-size: 16px;}
  
  .hint{font-size:11px;color:var(--muted);margin:4px 0 0;}
  .notice{display:flex;gap:8px;align-items:flex-start;background:#fff4e8;border:1px solid #f7d9b8;
    border-radius:10px;padding:10px;margin:0 0 10px;font-size:12px;line-height:1.5;color:#7a5220; flex-shrink: 0;}
  .notice.err{background:#fdeaea;border-color:#f6c7c4;color:#8a1c16}

  .agree{display:flex;gap:8px;align-items:flex-start;margin:0 0 10px;padding:10px;
    border:1px solid #f3c3d2;border-radius:10px;background:#fff8fa;cursor:pointer;font-size:13px;line-height:1.5;color:#5a3b45; flex-shrink: 0;}
  .agree input{margin:2px 0 0;accent-color:var(--pink);width:16px;height:16px;flex:none}

  button.primary{width:100%;padding:12px;border:0;border-radius:12px;font-family:inherit;font-size:15px;
    font-weight:700;color:#fff;background:linear-gradient(145deg,#ef6b8d,#d9446b);cursor:pointer;
    box-shadow:0 10px 20px -12px rgba(217,68,107,.95); flex-shrink: 0;}
  button.primary:disabled{opacity:.5;cursor:not-allowed;}

  /* SEARCH এবং WALL ট্যাব (ভেতরে স্ক্রল হবে) */
  .top-fixed { flex-shrink: 0; margin-bottom: 10px; }
  
  .searchbar{display:flex;gap:8px}
  .searchbar input{flex:1}
  .searchbar button{padding:0 16px;border:0;border-radius:10px;font-family:inherit;font-size:14px;
    font-weight:700;color:#fff;background:linear-gradient(145deg,#ef6b8d,#d9446b);cursor:pointer;white-space:nowrap;}
  
  /* চিঠির বক্স (যেখানে স্ক্রল হবে) */
  .letters-box {
    flex: 1;
    overflow-y: auto;
    padding-right: 4px; /* স্ক্রলবারের জন্য জায়গা */
    overscroll-behavior: contain; /* স্ক্রল শেষ হলে পুরো পেজ স্ক্রল হবে না */
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* কাস্টম স্ক্রলবার (সুন্দর দেখানোর জন্য) */
  .letters-box::-webkit-scrollbar { width: 5px; }
  .letters-box::-webkit-scrollbar-track { background: transparent; }
  .letters-box::-webkit-scrollbar-thumb { background: #e9dccc; border-radius: 10px; }
  .letters-box::-webkit-scrollbar-thumb:hover { background: #d8c5b0; }

  .letter{position:relative;
    background:repeating-linear-gradient(180deg, transparent 0 31px, rgba(224,85,122,.07) 31px 32px), var(--paper);
    border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px 20px;
    box-shadow:0 8px 20px -16px rgba(43,33,24,.6); flex-shrink: 0;}
  .letter::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;
    background:linear-gradient(180deg,#ffb3c6,#e0557a)}

  .letter-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
  .letter-head .to{font-size:14px;color:#6b5b4c}
  .letter-head .to b{color:var(--ink);font-size:15px}
  
  .badge.seal{
    background: #fdeef2; border: 1px solid #f7c9d6; width: 24px; height: 24px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 12px; padding: 0; animation: heartWiggle 2s ease-in-out infinite;
  }
  @keyframes heartWiggle {
    0%, 100% { transform: rotate(0deg) scale(1); }
    25% { transform: rotate(-10deg) scale(1.05); }
    75% { transform: rotate(10deg) scale(1.05); }
  }

  .letter-body{font-family:'Tiro Bangla',serif;font-size:15px;line-height:1.9;
    white-space:pre-wrap;word-break:break-word;margin:4px 0 10px}
  .letter-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;
    font-size:11.5px;color:var(--muted);border-top:1px dashed #eadfd0;padding-top:8px}
  .letter-foot .from{font-weight:600;color:#7a6857}

  .empty{text-align:center;color:var(--muted);padding:20px;font-size:14px;line-height:1.8}
  .empty .big{display:block;font-size:24px;margin-bottom:6px}
  .stats{text-align:center;font-size:12px;color:var(--muted); margin-top: 8px; flex-shrink: 0;}

  .shared-wrap{margin-bottom:10px; flex-shrink: 0;}
  .shared-title{font-size:12px;font-weight:700;color:var(--pink);margin:0 0 6px;text-align:center}

  /* ফুটার (ফিক্সড) */
  footer{
    text-align:center; font-size:12px; color:#a2937f; 
    margin-top: 10px; padding-bottom: env(safe-area-inset-bottom, 0px);
    flex-shrink: 0;
  }
  footer a{color:var(--pink);text-decoration:none;font-weight:700}

  .toast{position:fixed;left:50%;bottom:60px;transform:translate(-50%,20px);background:#2b2118;color:#fff;
    padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;
    box-shadow:0 10px 30px -10px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.25s;z-index:9999;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* 📱 মোবাইলের জন্য একদম পারফেক্ট সাইজ */
  @media(max-width: 600px){
    .app { padding: 8px; }
    .seal { display: none; }
    .tag { display: none; }
    header { margin-bottom: 8px; }
    
    .row { grid-template-columns: 1fr; gap: 6px; }
    .notice { display: none; } /* মোবাইলে জায়গা বাঁচাতে নোটিশ লুকানো */
    
    .letter { padding: 12px 10px 10px 16px; }
    .letter-body { font-size: 14.5px; line-height: 1.8; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="seal">💌</div>
    <h1>চিঠি</h1>
    <p class="tag">কিছু কথা রয়ে যায়, চিঠি হয়ে।</p>
  </header>

  <div id="configError" hidden style="flex-shrink:0; margin-bottom: 10px;">
    <div class="notice err" style="margin:0;">
      <span>⚠️ Supabase কনফিগার করা হয়নি।</span>
    </div>
  </div>

  <nav class="tabs">
    <button data-tab="write" class="active">চিঠি লিখুন</button>
    <button data-tab="search">খুঁজুন</button>
    <button data-tab="wall">দেওয়াল</button>
  </nav>

  <main>
    <div class="shared-wrap" id="sharedWrap" hidden>
      <p class="shared-title">✉️ তোমার জন্য একটি চিঠি</p>
      <div class="letters-box" id="sharedList"></div>
    </div>

    <!-- ============ WRITE ============ -->
    <section id="tab-write">
      <div class="card">
        <div class="notice">
          <span class="i">🔒</span>
          <span><b>একবার পাঠালে আর বদলানো যাবে না।</b> তাই পাঠানোর আগে দুবার পড়ে নাও।</span>
        </div>

        <form id="letterForm" autocomplete="off">
          <div class="row">
            <div class="field">
              <label for="to">কার কাছে 💝</label>
              <input type="text" id="to" placeholder="যার নামে চিঠি" maxlength="60" required>
            </div>
            <div class="field">
              <label for="from">আপনার নাম (ঐচ্ছিক)</label>
              <input type="text" id="from" placeholder="একজন অচেনা" maxlength="60">
            </div>
          </div>

          <div class="textarea-box">
            <label for="body">চিঠি</label>
            <textarea id="body" placeholder="প্রিয় ...,&#10;&#10;কি লিখবে ভাবছো? শুরু করো..." maxlength="4000" required></textarea>
            <p class="hint"><span id="counter">0</span>/4000 · ব্যক্তিগত তথ্য লিখো না।</p>
          </div>

          <label class="agree" for="agree">
            <input type="checkbox" id="agree" required>
            <span>আমি বুঝেছি — এটি <b>এডিট বা ডিলিট করা যাবে না</b>।</span>
          </label>

          <button type="submit" class="primary" id="submitBtn" disabled>চিঠি সিল করে দাও 💌</button>
        </form>
      </div>
    </section>

    <!-- ============ SEARCH ============ -->
    <section id="tab-search" hidden>
      <div class="card top-fixed" style="padding:12px;">
        <div class="searchbar">
          <input type="text" id="q" placeholder="নাম লিখো — যেমন: রাফি" maxlength="60">
          <button id="searchBtn" type="button">খুঁজুন</button>
        </div>
      </div>
      <div class="letters-box" id="searchResults"></div>
    </section>

    <!-- ============ WALL ============ -->
    <section id="tab-wall" hidden>
      <div class="card top-fixed" style="text-align:center; padding:10px;">
        <p style="margin:0;font-size:13px;color:#5a4b3d">
          🕊️ এখানে সব পাবলিক চিঠি
        </p>
      </div>
      <div class="letters-box" id="wallList"></div>
      <p class="stats" id="stats"></p>
    </section>
  </main>

  <footer>
    ❤️ Developer <a href="https://t.me/shakib2016" target="_blank" rel="noopener noreferrer">Sakib</a> ❤️
  </footer>
</div>

<div class="toast" id="toast"></div>
<script type="module" src="/src/app.js"></script>
</body>
</html>
